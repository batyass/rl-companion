# Daily GitHub Pages redeploy: re-fetch the RL shop and publish a fresh
# rotation, because the Pages site is a static snapshot that never updates
# on its own (see README → "Static-hosting caveat").
#
# The in-game shop rotates every day at 21:00 in France (Europe/Paris). In
# UTC that is 19:00 during summer (CEST, UTC+2) and 20:00 during winter
# (CET, UTC+1). Because a fixed UTC cron can't follow the DST switch, we run
# ~10 minutes after BOTH possible rotation times; whichever run fires after
# that day's rotation always has the fresh shop, and the other is an
# idempotent redeploy of the same data. Actions cron can also start up to
# ~15 min late under load, so the 10-minute buffer is enough.
#
# One-time repo setting required: Settings → Actions → General → Workflow
# permissions → "Read and write permissions", so the default GITHUB_TOKEN
# may push to the gh-pages branch. (Alternative: a fine-grained PAT with
# Contents read/write on this repo, stored as a GH_TOKEN secret, used in the
# remote URL below instead of GITHUB_TOKEN.)
#
# Fail-safe: if rlshop.gg is unreachable, the fetch step fails and gh-pages
# keeps the last good rotation until the next successful run.
name: Daily shop deploy

on:
  schedule:
    # 19:10, 20:10 & 21:10 UTC bracket the 21:00 Paris rotation in both
    # seasons (19:00 UTC in summer CEST, 20:00 UTC in winter CET). The two
    # extra slots are retry chances: if one run is late, cancelled, or fails,
    # the next one still catches the fresh rotation.
    - cron: "10 19 * * *"
    - cron: "10 20 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-shop-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Fetch today's shop from rlshop.gg
        # Public endpoints, no Epic login needed. Writes
        # tools/fetch-shop/out/shop.json + out/img/ (paths are resolved
        # relative to the script itself, so this works from the repo root).
        run: python3 tools/fetch-shop/fetch-rlshop.py

      - name: Check if the shop changed since the last deploy
        # Most runs see the *same* rotation (the shop changes once a day), so
        # rebuilding + force-pushing for identical data is wasted work. This
        # compares the fresh fetch against the live Pages site and sets
        # changed=true|false. On any uncertainty it deploys, so a failed
        # comparison can never freeze the site.
        id: check
        run: python3 tools/fetch-shop/check-unchanged.py

      - name: Publish to gh-pages
        # Only when the shop actually changed (or the comparison was
        # inconclusive). Point origin at a token-authenticated URL so
        # deploy-pages.sh's force-push works. GITHUB_TOKEN is scoped to this
        # job and dies with it, so nothing persists.
        if: steps.check.outputs.changed == 'true'
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          ./tools/deploy-pages.sh
