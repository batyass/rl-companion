<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello, World — powered by Zero</title>
<meta name="description" content="A tiny hello world page, hosted free with Zero." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #05060f;
    --ink: #eef1ff;
    --muted: #9aa3c7;
    --violet: #8b5cf6;
    --cyan: #22d3ee;
    --pink: #f472b6;
    --amber: #fbbf24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Aurora backdrop ---------- */
  .aurora {
    position: fixed;
    inset: -20%;
    z-index: 0;
    filter: blur(70px);
    opacity: 0.85;
    animation: aurora-drift 26s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .aurora .blob {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
  }
  .blob-1 {
    width: 55vmax; height: 55vmax;
    left: -12%; top: -18%;
    background: radial-gradient(circle at 35% 35%, rgba(139, 92, 246, 0.55), transparent 62%);
    animation: float-a 18s ease-in-out infinite alternate;
  }
  .blob-2 {
    width: 48vmax; height: 48vmax;
    right: -14%; top: 6%;
    background: radial-gradient(circle at 60% 40%, rgba(34, 211, 238, 0.45), transparent 62%);
    animation: float-b 22s ease-in-out infinite alternate;
  }
  .blob-3 {
    width: 42vmax; height: 42vmax;
    left: 22%; bottom: -26%;
    background: radial-gradient(circle at 50% 50%, rgba(244, 114, 182, 0.40), transparent 62%);
    animation: float-c 20s ease-in-out infinite alternate;
  }
  .blob-4 {
    width: 34vmax; height: 34vmax;
    right: 18%; bottom: -14%;
    background: radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.28), transparent 62%);
    animation: float-a 24s ease-in-out infinite alternate-reverse;
  }

  @keyframes aurora-drift {
    0%   { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(8deg) scale(1.12); }
  }
  @keyframes float-a { from { transform: translate(0, 0); } to { transform: translate(6vmax, 4vmax); } }
  @keyframes float-b { from { transform: translate(0, 0); } to { transform: translate(-5vmax, 6vmax); } }
  @keyframes float-c { from { transform: translate(0, 0); } to { transform: translate(4vmax, -5vmax); } }

  /* ---------- Starfield canvas ---------- */
  #stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* ---------- Cursor glow ---------- */
  #glow {
    position: fixed;
    width: 34rem; height: 34rem;
    left: 0; top: 0;
    margin: -17rem 0 0 -17rem;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.10), transparent 60%);
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
    will-change: transform;
  }
  body:hover #glow { opacity: 1; }

  /* ---------- Content ---------- */
  main {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    gap: 1.6rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(12px);
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
  }
  .badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 12px rgba(52, 211, 153, 0.9);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } }

  h1 {
    font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    font-size: clamp(3rem, 11vw, 8.5rem);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.03em;
    background: linear-gradient(100deg, #ffffff 0%, #c7d2fe 25%, var(--cyan) 50%, var(--pink) 75%, var(--violet) 100%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 7s linear infinite, rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
  }
  @keyframes shine {
    0% { background-position: 0% center; }
    100% { background-position: 220% center; }
  }

  .sub {
    max-width: 34rem;
    color: var(--muted);
    font-size: clamp(1rem, 2.6vw, 1.25rem);
    line-height: 1.7;
    opacity: 0;
    animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.8s forwards;
  }
  .sub strong { color: var(--ink); font-weight: 500; }

  .wave {
    display: inline-block;
    font-size: 1.35em;
    animation: wave 2.6s ease-in-out infinite;
    transform-origin: 70% 70%;
  }
  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0deg); }
    10%, 30% { transform: rotate(16deg); }
    20%, 40% { transform: rotate(-8deg); }
  }

  .btn {
    margin-top: 0.6rem;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.95rem 2rem;
    border-radius: 999px;
    font-family: "Space Grotesk", sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: #0b0b1a;
    background: linear-gradient(120deg, var(--cyan), var(--violet), var(--pink));
    background-size: 200% auto;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(139, 92, 246, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease, background-position 0.4s ease;
    opacity: 0;
    animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 1.1s forwards;
  }
  .btn:hover {
    transform: translateY(-2px) scale(1.03);
    background-position: right center;
    box-shadow: 0 14px 44px rgba(139, 92, 246, 0.5);
  }
  .btn:active { transform: translateY(0) scale(0.99); }

  #sparkline {
    margin-top: 2.4rem;
    font-size: 0.85rem;
    color: var(--muted);
    opacity: 0;
    animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 1.4s forwards;
  }
  #sparkline .sep { opacity: 0.4; margin: 0 0.5rem; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .aurora { animation: none; }
    h1 { background-attachment: fixed; }
  }

  @media (max-width: 480px) {
    main { gap: 1.2rem; }
    .badge { font-size: 0.7rem; }
    #sparkline { font-size: 0.75rem; }
  }
</style>
</head>
<body>

  <div class="aurora" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="glow" aria-hidden="true"></div>

  <main>
    <span class="badge"><span class="dot"></span> Deployed free with Zero</span>
    <h1>Hello, World</h1>
    <p class="sub"><span class="wave">👋</span> A tiny hello world page, shipped to a live public URL in seconds — no servers, no config, no credit card.</p>
    <button class="btn" id="spark">Make a wish ✨</button>
    <p id="sparkline"><span>Static site</span><span class="sep">·</span><span>Single file</span><span class="sep">·</span><span>100% free</span></p>
  </main>

<script>
(function () {
  // ---------- Starfield ----------
  var canvas = document.getElementById("stars");
  var ctx = canvas.getContext("2d");
  var stars = [];
  var W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = Math.floor(innerWidth * DPR);
    H = canvas.height = Math.floor(innerHeight * DPR);
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    var count = Math.min(260, Math.floor((innerWidth * innerHeight) / 6000));
    stars = [];
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: (Math.random() * 1.4 + 0.3) * DPR,
        base: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.9 + 0.25,
        hue: Math.random() < 0.82 ? 0 : (Math.random() < 0.5 ? 265 : 195)
      });
    }
  }

  var shooting = null;
  function spawnShootingStar() {
    shooting = {
      x: Math.random() * W * 0.7 + W * 0.2,
      y: Math.random() * H * 0.35,
      vx: (Math.random() * 2.6 + 3.2) * DPR,
      vy: (Math.random() * 1.4 + 1.6) * DPR,
      life: 1
    };
  }
  setTimeout(spawnShootingStar, 2400);

  var t = 0;
  function tick() {
    t += 0.016;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(t * s.speed + s.base));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.hue ? "hsla(" + s.hue + ", 85%, 80%, " + a + ")" : "rgba(255,255,255," + a * 0.9 + ")";
      ctx.fill();
    }
    if (shooting) {
      var st = shooting;
      ctx.strokeStyle = "rgba(255,255,255," + st.life * 0.85 + ")";
      ctx.lineWidth = 1.6 * DPR;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(st.x, st.y);
      ctx.lineTo(st.x - st.vx * 9, st.y - st.vy * 9);
      ctx.stroke();
      st.x += st.vx; st.y += st.vy; st.life -= 0.016;
      if (st.life <= 0) shooting = null;
    } else if (Math.random() < 0.004) {
      spawnShootingStar();
    }
    requestAnimationFrame(tick);
  }

  // ---------- Cursor glow ----------
  var glow = document.getElementById("glow");
  var gx = -9999, gy = -9999, cx = -9999, cy = -9999;
  document.addEventListener("mousemove", function (e) {
    gx = e.clientX; gy = e.clientY;
  });
  (function glowLoop() {
    cx += (gx - cx) * 0.12;
    cy += (gy - cy) * 0.12;
    glow.style.transform = "translate(" + cx + "px," + cy + "px)";
    requestAnimationFrame(glowLoop);
  })();

  // ---------- Wish button ----------
  var button = document.getElementById("spark");
  var wishes = ["Hello back! 👋", "You're officially hosted on the internet 🎉", "Zero made this free 💜", "Hello, World — the classic never gets old ✨"];
  button.addEventListener("click", function () {
    var p = document.createElement("div");
    p.textContent = wishes[Math.floor(Math.random() * wishes.length)];
    p.style.cssText = "position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:5;" +
      "font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:600;color:#fff;" +
      "padding:1rem 1.6rem;border-radius:1rem;background:rgba(20,20,45,0.85);border:1px solid rgba(255,255,255,0.15);" +
      "backdrop-filter:blur(14px);box-shadow:0 18px 60px rgba(139,92,246,0.45);" +
      "opacity:0;transition:opacity .3s ease,transform .3s cubic-bezier(.22,1,.36,1);pointer-events:none;";
    document.body.appendChild(p);
    requestAnimationFrame(function () {
      p.style.opacity = "1";
      p.style.transform = "translate(-50%,-58%)";
    });
    setTimeout(function () {
      p.style.opacity = "0";
      p.style.transform = "translate(-50%,-42%) scale(0.94)";
      setTimeout(function () { p.remove(); }, 320);
    }, 2400);
  });

  // ---------- Boot ----------
  resize();
  addEventListener("resize", resize);
  requestAnimationFrame(tick);

  // Respect reduced motion for the canvas & glow
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    cancelAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
